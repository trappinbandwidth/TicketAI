<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rig Resolve — Scanner Moved</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #2d3142;
        --ink-deep: #1a1e2e;
        --teal: #2ec4a5;
        --off: #f8fafc;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--off);
        color: var(--ink);
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        width: min(92vw, 560px);
        border: 1px solid #e2e8f0;
        border-radius: 12px;
        background: #fff;
        padding: 32px;
        box-shadow: 0 18px 48px rgba(45, 49, 66, 0.12);
      }
      .brand {
        margin: 0 0 16px;
        color: var(--ink-deep);
        font-size: 20px;
        font-weight: 900;
        letter-spacing: -0.02em;
      }
      .brand span {
        color: var(--teal);
      }
      h1 {
        margin: 0 0 10px;
        font-size: 28px;
        line-height: 1.1;
      }
      p {
        margin: 0 0 14px;
        color: #475569;
        line-height: 1.55;
      }
      code {
        border-radius: 6px;
        background: #f1f5f9;
        color: var(--ink);
        padding: 2px 6px;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="brand">rig<span>(</span>resolve</p>
      <h1>Scanner UI moved into Admin</h1>
      <p>
        The AI Ticket Engine remains the backend processing service. The reviewer-facing
        upload and QA workflow now lives in the Rig Resolve Admin Portal under <code>Scanner</code>.
      </p>
      <p>
        Keep using the engine API routes for processing, queue, approve, reject, and audit work.
      </p>
    </main>
  </body>
</html>
